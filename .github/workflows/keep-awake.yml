name: keep-awake

on:
  schedule:
    - cron: "*/10 23,0-14 * * *"   # UTC 기준 = 한국 시간 08:00~23:59, 10분마다
  workflow_dispatch:                 # GitHub 화면에서 직접 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl -fsS --max-time 90 https://ai-study-spring.onrender.com/health || true